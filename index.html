<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Etno-Expandido · Un objeto, mil historias</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%237a260c'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/img/pantallas/pantalla-inicio.jpg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main id="app" class="app">

  <!-- Phase 1: static screens -->
  <section class="screen screen-static" data-screen="inicio" aria-hidden="true">
    <div class="screen-frame">
      <img class="screen-image" alt="">
      <button class="hotspot" type="button"></button>
    </div>
  </section>

  <section class="screen screen-static" data-screen="confirmacion" aria-hidden="true">
    <div class="screen-frame">
      <img class="screen-image" alt="">
      <button class="hotspot" type="button"></button>
    </div>
  </section>

  <!-- Phase 2: 360 experience. The floating layer sits above the canvas. -->
  <section class="screen screen-vr" data-screen="vr" aria-hidden="true">
    <div class="pano"></div>
    <div class="floating-layer">
      <div class="eye eye-left"><img class="floating-img" alt=""></div>
      <div class="eye eye-right"><img class="floating-img" alt=""></div>
    </div>
    <div class="vr-notice" role="status"></div>
  </section>

  <!-- Phase 3: closing screen -->
  <section class="screen screen-static" data-screen="cierre" aria-hidden="true">
    <div class="screen-frame">
      <img class="screen-image" alt="">
    </div>
  </section>

</main>

<script src="vendor/marzipano.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
